# ==============================================================================
# Plant Disease Classification — Sample Configuration File (Milestone 3)
# ==============================================================================
# Lightweight configuration for sample dataset testing and verification.
# ==============================================================================

# --- 1. Project-Level Settings ---
project:
  name: plant_disease_classification_sample
  seed: 42

# --- 2. Sample Dataset Settings ---
data:
  train_dir: "sample_dataset/train"
  val_dir: "sample_dataset/val"
  test_dir: "sample_dataset/test"

  image_size: 224
  batch_size: 4
  num_workers: 0

# --- 3. Model Architecture Settings ---
model:
  name: efficientnet_v2_s
  pretrained: true
  freeze_backbone: true
  num_classes: null
  dropout: 0.3

# --- 4. Training Hyperparameters ---
training:
  epochs: 5

  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    betas:
      - 0.9
      - 0.999

  scheduler:
    name: cosine
    min_lr: 0.000001
    warmup_epochs: 0

  loss:
    name: cross_entropy
    label_smoothing: 0.0

  amp:
    enabled: true

  gradient:
    clipping:
      enabled: true
      max_norm: 1.0

  early_stopping:
    enabled: true
    patience: 15
    monitor: val_accuracy
    mode: max

# --- 5. Checkpoint Settings ---
checkpoint:
  save_best: true
  save_last: true
  directory: "checkpoints"

# --- 6. Logging Settings ---
logging:
  tensorboard: true
  csv: true
  json: true

# --- 7. Hardware Runtime Settings ---
runtime:
  device: auto
